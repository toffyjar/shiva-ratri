basePath: /api/v1
definitions:
  handler.PlaceOption:
    properties:
      label:
        type: string
      latitude:
        type: string
      longitude:
        type: string
      value:
        type: string
    type: object
  handler.TimezoneOption:
    properties:
      timeZone:
        type: string
      utcOffset:
        type: string
    type: object
  model.AuthResponse:
    properties:
      email:
        type: string
      id:
        type: string
      token:
        type: string
    type: object
  model.KundaliSave:
    properties:
      birthPlace:
        type: string
      created_at:
        type: string
      day:
        type: string
      hour:
        type: string
      id:
        type: integer
      isFemale:
        type: string
      latitude:
        type: string
      longitude:
        type: string
      minute:
        type: string
      month:
        type: string
      name:
        type: string
      timeZone:
        type: string
      user_id:
        type: string
      year:
        type: string
    type: object
  model.Kundli:
    properties:
      birthPlace:
        type: string
      day:
        type: string
      hour:
        type: string
      isFemale:
        type: string
      latitude:
        type: string
      longitude:
        type: string
      minute:
        type: string
      month:
        type: string
      name:
        type: string
      timeZone:
        type: string
      year:
        type: string
    required:
    - birthPlace
    - day
    - hour
    - isFemale
    - latitude
    - longitude
    - minute
    - month
    - name
    - timeZone
    - year
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
host: localhost:5656
info:
  contact: {}
  description: Jyotish API for managing users and kundali charts
  title: Jyotish API
  version: "1.0"
paths:
  /all-kundali:
    get:
      consumes:
      - application/json
      description: Get all kundali charts across all users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all kundalis
      tags:
      - kundali
  /geolocation/search:
    get:
      consumes:
      - application/json
      description: Proxy to OpenStreetMap Nominatim search API, normalized to {value,
        label, latitude, longitude}
      parameters:
      - description: Place name query
        in: query
        name: q
        required: true
        type: string
      - description: Max results (default 5)
        in: query
        name: limit
        type: integer
      - description: Include address details (default 1)
        in: query
        name: addressdetails
        type: integer
      - description: Response format (default json)
        in: query
        name: format
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.PlaceOption'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      summary: Search places via Nominatim
      tags:
      - geolocation
  /list-kundali:
    get:
      consumes:
      - application/json
      description: Get all kundali charts for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List user kundalis
      tags:
      - kundali
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, returns JWT token
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - auth
  /save-kundali:
    post:
      consumes:
      - application/json
      description: Save a kundali chart for the authenticated user
      parameters:
      - description: Kundali birth details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.Kundli'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.KundaliSave'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Save kundali chart
      tags:
      - kundali
  /timezone/search:
    get:
      consumes:
      - application/json
      description: Proxy to timeapi.io TimeZone/coordinate API, normalized to {timeZone,
        utcOffset}
      parameters:
      - description: Latitude
        in: query
        name: latitude
        required: true
        type: number
      - description: Longitude
        in: query
        name: longitude
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TimezoneOption'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      summary: Look up timezone by coordinates
      tags:
      - geolocation
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
